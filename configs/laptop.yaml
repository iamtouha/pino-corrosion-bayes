# Budget for a 4 GB laptop GPU (RTX 3050 Ti, thermally throttled): ~2 days end to end.
# Measured: FNO fwd+bwd ~20 ms per sample (batch 16 -> ~0.3 s/step), PINO ~2x, inference
# ~15 ms per field.  The spec's budget (base.yaml: 54 runs x 60k steps, 100-case benchmark
# x 12 conditions) would take > 3 weeks here.  Architecture, datasets and procedures are
# unchanged; only steps, seeds and case counts are reduced.
tag: laptop

dic:
  fit_filter_cases: 10          # validation pits only (l_f is fitted from sinusoids)
  fit_noise_fields: 12
  fit_noise_realizations: 30

train:
  steps: 8000
  eval_every: 1000
  lam_r_select_steps: 2000
  lam_r_select_N: 500           # pick lam_r once per family at this N, reuse for all N

study:
  seeds: [0, 1]

inference:
  n_cases: 30
  n_zero_delta: 3
  designs: [grid56, full]
  full_design_cases: 6          # full-field design on the first 6 cases only
  models: [pino]
  surrogate_N: [100, 2000]
  fe_reference_cases: 4
  tmcmc: {n: 1000, scale: 0.2, n_mh: 2}   # FNO inference ~15 ms/field here
  fe_tmcmc: {n: 1000, scale: 0.2, n_mh: 2}
  full_dice_cases: 6
  # Quick run: ~5-9 s per NUTS iteration (deep trees through the FNO); the spec's
  # 4 chains x 1500 iterations would be ~10 h per case here.
  nuts: {num_samples: 500, warmup_steps: 500, chains: 2, target_accept: 0.9, max_tree_depth: 8}

capacity:
  n_ccx: 8           # ~2-4 min per CalculiX run on this CPU

